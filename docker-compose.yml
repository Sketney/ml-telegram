services:
  db:
    # Postgres с расширением pgvector: оно понадобится на этапе 3 для поиска повторов тем.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: mlbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlbot -d mlbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mlbot:${POSTGRES_PASSWORD}@db:5432/mlbot}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Промпты, бэклог и расписание правятся без пересборки образа: поменял файл → docker compose restart bot
      - ./prompts:/srv/prompts:ro
      - ./data:/srv/data:ro
      # Персонаж канала для обложек и шпаргалок (brand/mascot.png). Папки нет — картинки будут без него.
      - ./brand:/srv/brand:ro
      - whisper:/srv/whisper
      - media:/srv/media

  # Раздаёт обложки постов по HTTPS: длинному посту Telegram подтягивает картинку сам, по её адресу.
  # Включается профилем: COMPOSE_PROFILES=web в .env. Нужны открытые порты 80 и 443 и MEDIA_HOST.
  web:
    profiles: [web]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MEDIA_HOST: ${MEDIA_HOST:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  whisper:
  media:
  caddy_data:
  caddy_config:
