# Расписание публикаций. Время — в часовом поясе TIMEZONE из .env.
# Дни: mon tue wed thu fri sat sun.
#
# Как это работает:
#   1. Каждый день в prepare_at бот проверяет каждую рубрику по бэклогу из slots. Если для неё меньше
#      buffer черновиков (ждущих решения или одобренных), он генерирует новый и шлёт на модерацию.
#      Рубрики по источникам (paper, release, tool) сами не готовятся: черновик запускается из /digest.
#   2. В момент слота публикуется самый старый ОДОБРЕННЫЙ черновик этой рубрики.
#      Одобренного нет — слот пропускается, бот пишет об этом автору.
#   3. У рубрики без слота (например, release) кнопки «В расписание» нет: её публикуют кнопкой «Сейчас».

prepare_at: "18:00"
buffer: 1

slots:
  # В слоте можно перечислить несколько рубрик: выйдет самый давно одобренный черновик любой из них.
  # Так рубрики чередуются сами: неопубликованный черновик ждёт следующего слота, новый пока не готовится.
  - { day: mon, time: "10:00", rubrics: [concept, interview] }
  - { day: tue, time: "10:00", rubric: course }   # курс «ML с нуля»: один урок в неделю
  - { day: tue, time: "19:00", rubric: course_quiz }   # вечером — квиз «Проверь себя» по утреннему уроку
  - { day: wed, time: "10:00", rubrics: [paper, experiment, practice] }
  - { day: thu, time: "10:00", rubric: quiz }
  - { day: fri, time: "10:00", rubrics: [cheatsheet, history] }
  - { day: sat, time: "11:00", rubric: fact }
  - { day: sun, time: "11:00", rubric: tool }

# Раз в день бот снимает просмотры постов с публичной страницы канала (команда /stats).
stats_at: "09:00"
