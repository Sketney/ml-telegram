# Программа курса «ML с нуля» (рубрика course).
#
# Уроки выходят по порядку номеров. Этот файл — источник правды: бот читает его при каждой генерации,
# поэтому ещё не вышедшие уроки можно править, переставлять и добавлять (после правки — docker compose restart bot).
#   n      — номер урока. Уникальный, по возрастанию. У вышедших уроков номер и название не меняй.
#   title  — название урока, до 50 символов: оно идёт в заголовок поста, на обложку и в оглавление.
#   covers — тезисы, которые урок обязан раскрыть. Модель пишет по ним и не должна им противоречить,
#            так что это место, где проверяются факты: имена, годы, определения.

title: ML с нуля
intro: >-
  Курс для тех, кто начинает с нуля. Один урок в неделю, каждый опирается на предыдущие.
  Здесь оглавление: вышедшие уроки открываются по ссылке, остальные впереди.

blocks:
  - title: Что такое машинное обучение
    lessons:
      - n: 1
        title: Что такое машинное обучение
        covers: |
          - Обычная программа: правила пишет человек. Машинное обучение: правила выводятся из примеров.
          - Модель — это функция с настраиваемыми числами (параметрами); обучение — подбор этих чисел по данным.
          - Пример: спам-фильтр на ручных правилах против фильтра, обученного на размеченных письмах.
          - Три вида обучения одной строкой каждый: с учителем (есть правильные ответы), без учителя
            (ответов нет, ищем структуру), с подкреплением (учимся по наградам). Курс в основном про первый.
          - ML не понимает задачу, а находит закономерности в данных: на непохожих данных он ошибается.
      - n: 2
        title: Данные, признаки и разметка
        covers: |
          - Объект — то, про что делаем прогноз (письмо, квартира, запрос). Признаки (features) — его измеримые свойства.
          - Целевая переменная (target, label) — то, что хотим предсказать. Разметка — проставленные правильные ответы.
          - Данные удобно представлять таблицей: строка — объект, столбец — признак, отдельный столбец — ответ.
          - Модель работает с числами, поэтому текст, категории и даты сначала превращают в числа.
          - Качество модели ограничено качеством данных: ошибки и перекосы в данных она выучит как закономерность.
      - n: 3
        title: Регрессия и классификация
        covers: |
          - Регрессия предсказывает число (цена, время отклика), классификация — класс (спам или не спам).
          - Классификация бывает бинарной (два класса) и многоклассовой.
          - Классификатор обычно выдаёт вероятность, а решение принимается по порогу, который выбирает человек.
          - Одна и та же бизнес-задача может быть поставлена по-разному: «сколько дней до поломки» — регрессия,
            «сломается ли за неделю» — классификация.
          - Кластеризация — пример задачи без правильных ответов: объекты группируются по сходству.
      - n: 4
        title: Функция потерь
        covers: |
          - Функция потерь (loss) превращает ошибку модели в одно число: чем оно меньше, тем лучше.
          - Обучение — это подбор параметров, при которых потери на обучающих данных минимальны.
          - Пример для регрессии — MSE (mean squared error): средний квадрат разницы между прогнозом и ответом.
            Квадрат сильнее штрафует большие промахи.
          - Потери и метрика — разные вещи: потери нужны алгоритму обучения, метрика — человеку для оценки результата.
      - n: 5
        title: Train, validation, test
        covers: |
          - Модель оценивают только на данных, которых она не видела при обучении.
          - Train — для обучения, validation — для выбора настроек и сравнения вариантов, test — для финальной
            оценки, к которой обращаются один раз в конце.
          - Доли вроде 80/10/10 — ориентир, а не правило.
          - Утечка данных (data leakage): информация из проверочных данных попала в обучение, и оценка
            получилась завышенной. Пример: дубликаты одной записи и в train, и в test.
          - Для данных со временем делят по времени: учимся на прошлом, проверяем на будущем.
      - n: 6
        title: Переобучение и недообучение
        covers: |
          - Переобучение (overfitting): модель запомнила обучающие примеры вместе с шумом. На train качество высокое,
            на validation заметно хуже.
          - Недообучение (underfitting): модель слишком простая или мало училась. Плохо и на train, и на validation.
          - Различают их по зазору между качеством на train и на validation.
          - От переобучения помогают: больше данных, модель проще, регуляризация, ранняя остановка.
          - От недообучения: модель сложнее, лучшие признаки, дольше учить.

  - title: Классические модели и метрики
    lessons:
      - n: 7
        title: Линейная регрессия
        covers: |
          - Прогноз — взвешенная сумма признаков плюс свободный член (смещение).
          - Вес признака показывает, на сколько меняется прогноз, если признак вырос на единицу, а остальные не менялись.
          - Веса подбирают так, чтобы минимизировать MSE на обучающих данных.
          - Плюсы: простая, быстрая, результат можно объяснить. Минус: улавливает только линейные зависимости.
          - Это типичная базовая модель (baseline), с которой сравнивают более сложные.
      - n: 8
        title: Логистическая регрессия
        covers: |
          - Несмотря на название, это модель классификации.
          - Та же взвешенная сумма признаков пропускается через сигмоиду — функцию, которая сжимает любое число
            в диапазон от 0 до 1. Результат трактуют как вероятность класса.
          - Решение принимается по порогу. 0,5 — значение по умолчанию, его двигают под цену ошибки.
          - Хорошая базовая модель для классификации: быстро учится и её можно объяснить.
      - n: 9
        title: Метрики классификации
        covers: |
          - Accuracy — доля верных ответов. При перекосе классов обманывает: если мошеннических операций 1%,
            модель «всегда не мошенник» даёт 99% accuracy и бесполезна.
          - Матрица ошибок: TP, FP, FN, TN — верно и неверно найденные положительные и отрицательные.
          - Precision = TP / (TP + FP): какая доля срабатываний модели верна.
          - Recall = TP / (TP + FN): какую долю нужных объектов модель нашла.
          - F1 — гармоническое среднее precision и recall.
          - Метрику выбирают по цене ошибки: что дороже, ложная тревога или пропуск.
      - n: 10
        title: Деревья решений
        covers: |
          - Дерево решений — цепочка вопросов вида «признак больше порога?», в листьях — ответ.
          - Дерево строится жадно: на каждом шаге выбирается разбиение, которое лучше всего разделяет данные.
          - Плюсы: читается человеком, не требует масштабирования признаков, работает с нелинейными зависимостями.
          - Минус: глубокое дерево легко переобучается, поэтому глубину и размер листьев ограничивают.
      - n: 11
        title: Случайный лес и градиентный бустинг
        covers: |
          - Ансамбль — несколько моделей, чьи ответы объединяются; вместе они точнее одной.
          - Случайный лес: много деревьев, каждое учится на случайной подвыборке данных и признаков,
            ответы усредняются или выбираются голосованием. Этот приём называется бэггинг (bagging).
          - Градиентный бустинг: деревья строятся по очереди, каждое следующее исправляет ошибки уже построенных.
          - XGBoost, LightGBM и CatBoost — популярные библиотеки бустинга.
          - На табличных данных бустинг — один из самых сильных стандартных инструментов.
      - n: 12
        title: Подготовка признаков
        covers: |
          - Масштабирование приводит признаки к сопоставимому диапазону. Оно важно линейным моделям и нейросетям,
            деревьям не нужно.
          - Категориальные признаки превращают в числа; базовый способ — one-hot encoding: отдельный столбец
            из нулей и единиц на каждое значение.
          - Пропуски нужно обработать явно: заполнить или добавить признак «значение пропущено».
          - Параметры преобразований (среднее, минимум, максимум) считают только по train и применяют к остальным
            частям. Иначе получается утечка данных.

  - title: Нейросети
    lessons:
      - n: 13
        title: Нейрон и слой
        covers: |
          - Искусственный нейрон: взвешенная сумма входов плюс смещение, затем функция активации.
          - Слой — много нейронов, получающих одни и те же входы; сеть — слои, идущие друг за другом.
          - Без нелинейной активации сколько угодно слоёв сводятся к одному линейному преобразованию.
          - ReLU — самая распространённая активация: max(0, x).
          - Параметры сети — это веса и смещения всех нейронов; у современных сетей их от тысяч до миллиардов.
      - n: 14
        title: Градиентный спуск
        covers: |
          - Потери можно представить как рельеф: каждой комбинации параметров соответствует своя высота.
          - Градиент показывает направление самого быстрого роста потерь; шаг делают в противоположную сторону.
          - Learning rate — размер шага. Слишком большой — обучение расходится, слишком маленький — идёт долго.
          - Стохастический градиентный спуск (SGD): шаг считают не по всем данным, а по небольшой порции (batch).
          - Эпоха — один проход по всем обучающим данным.
      - n: 15
        title: Обратное распространение ошибки
        covers: |
          - Обратное распространение (backpropagation) — способ посчитать, как каждый вес сети повлиял на потери.
          - Расчёт идёт от выхода сети к входу и опирается на цепное правило дифференцирования.
          - Фреймворки вроде PyTorch считают градиенты автоматически (autograd): вручную производные не выводят.
          - Цикл обучения: прямой проход, расчёт потерь, обратный проход, шаг оптимизатора.
      - n: 16
        title: Как обучают нейросети на практике
        covers: |
          - Параметры модель выучивает сама; гиперпараметры (learning rate, размер batch, число эпох) задаёт человек.
          - Adam — распространённый оптимизатор, с которого часто начинают.
          - Приёмы против переобучения: dropout (случайное отключение части нейронов при обучении),
            weight decay, ранняя остановка по качеству на validation.
          - GPU нужны потому, что обучение сводится к массовым операциям над матрицами, а они хорошо распараллеливаются.
          - За обучением следят по кривым потерь на train и на validation.
      - n: 17
        title: Свёрточные сети и изображения
        covers: |
          - Для модели картинка — сетка чисел: яркости пикселей по цветовым каналам.
          - Свёртка: небольшой фильтр скользит по изображению и откликается на локальный узор.
          - Один и тот же фильтр применяется ко всей картинке, поэтому параметров намного меньше, чем у полносвязного слоя.
          - Первые слои выделяют простые детали вроде границ, глубокие — сложные формы.
          - В 2012 году свёрточная сеть AlexNet с большим отрывом выиграла конкурс ImageNet; с этого началась
            волна интереса к глубокому обучению.
      - n: 18
        title: Эмбеддинги
        covers: |
          - Эмбеддинг — вектор чисел, которым модель представляет объект (слово, текст, картинку) так,
            что близкие по смыслу объекты получают близкие векторы.
          - Эмбеддинги не задаются вручную, а выучиваются из данных.
          - word2vec (2013) — классический метод обучения эмбеддингов слов.
          - Близость векторов обычно измеряют косинусным сходством.
          - На эмбеддингах построены поиск по смыслу и рекомендации.

  - title: Большие языковые модели
    lessons:
      - n: 19
        title: Токены и языковая модель
        covers: |
          - Языковая модель предсказывает следующий токен по предыдущим; текст порождается по одному токену.
          - Токен — фрагмент текста: слово, часть слова или знак. Текст режет на токены токенизатор.
          - Контекстное окно — сколько токенов модель учитывает за один раз.
          - Модель выдаёт вероятности для всех возможных следующих токенов; температура управляет тем,
            насколько случайно из них выбирают.
          - Модель не ищет ответ в базе фактов, а порождает правдоподобное продолжение текста.
      - n: 20
        title: Внимание и трансформер
        covers: |
          - Механизм внимания (attention): обрабатывая токен, модель взвешивает, какие другие токены контекста для него важны.
          - Трансформер — архитектура, построенная на внимании; описана в статье «Attention Is All You Need» (2017).
          - В отличие от рекуррентных сетей, трансформер обрабатывает токены последовательности параллельно,
            поэтому его удалось обучать на очень больших объёмах текста.
          - Модели семейства GPT — трансформеры, обученные предсказывать следующий токен.
      - n: 21
        title: Предобучение и дообучение LLM
        covers: |
          - Предобучение: модель учится предсказывать следующий токен на огромном корпусе текста.
            Ручная разметка не нужна: правильный ответ — само продолжение текста.
          - Дообучение (fine-tuning): предобученную модель доучивают на небольшом наборе данных под задачу или стиль.
          - Чтобы модель следовала инструкциям, её дообучают на примерах «запрос — хороший ответ».
          - LoRA: вместо всех весов обучают небольшие добавочные матрицы, это намного дешевле полного дообучения.
          - Дообучение меняет поведение модели, но плохо подходит для того, чтобы дать ей свежие или часто меняющиеся факты.
      - n: 22
        title: Промпты, контекст и галлюцинации
        covers: |
          - Между запросами модель ничего не помнит: всё, что она знает о задаче, находится в контексте запроса.
          - Системный промпт задаёт роль и правила; примеры в промпте (few-shot) показывают желаемый формат.
          - Галлюцинация — уверенный и правдоподобный, но неверный ответ. Причина в том, что модель порождает
            правдоподобный текст, а не проверяет факты.
          - Чем конкретнее задача и чем больше нужных данных в контексте, тем надёжнее ответ.
          - Важные ответы проверяют: по источникам, тестами или человеком.
      - n: 23
        title: "RAG: как дать модели свои данные"
        covers: |
          - RAG (Retrieval-Augmented Generation): перед ответом система находит подходящие фрагменты документов
            и кладёт их в контекст модели.
          - Шаги: документы режут на фрагменты (чанки), для каждого считают эмбеддинг, по запросу находят
            ближайшие фрагменты, модель отвечает с опорой на них.
          - Модель при этом не переобучают: данные можно обновлять сразу.
          - Качество ответа ограничено качеством поиска: если нужный фрагмент не найден, модель не ответит верно.
          - RAG снижает число галлюцинаций, но не исключает их.
      - n: 24
        title: Агенты и инструменты
        covers: |
          - Вызов инструментов (tool calling): модель возвращает структурированный запрос на вызов функции,
            программа его выполняет и отдаёт результат обратно модели.
          - Агент — цикл: модель выбирает действие, получает результат и повторяет, пока задача не решена.
          - Так модель получает доступ к поиску, коду, базам данных и внешним сервисам.
          - Риски: ошибки накапливаются от шага к шагу, а действия могут быть необратимыми. Поэтому агентам
            ограничивают права и оставляют за человеком подтверждение важных действий.
          - Это последний урок курса: подведи итог пройденного пути одной-двумя фразами.
