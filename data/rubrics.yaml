# Рубрики канала. Этап 1 — три вечнозелёные; остальные добавляются на этапах 2–3.
# hashtag и title можно менять свободно, key — нет (на него ссылаются расписание, бэклог и промпты).
# У хештегов общий префикс EML_ (Easy_ML): по нему рубрики канала не смешиваются с чужими постами в поиске.
# min_len / max_len — рекомендованная длина видимого текста поста в символах.

concept:
  title: Понятие недели
  hashtag: "#EML_concept"
  kind: post
  min_len: 1200
  max_len: 2000

history:
  title: История ML
  hashtag: "#EML_history"
  kind: post
  min_len: 1000
  max_len: 1800

quiz:
  title: Квиз
  hashtag: "#EML_quiz"
  kind: quiz

# --- Рубрики по источникам (source: feed) -------------------------------------
# Темы для них не берутся из бэклога: бот собирает материалы (data/sources.yaml),
# присылает дайджест кандидатов, а черновик пишется по тексту выбранного источника.

paper:
  title: Разбор статьи
  hashtag: "#EML_paper"
  kind: post
  source: feed
  min_len: 1500
  max_len: 2600

# author_block — блок, который автор вписывает сам: в черновике появляется заглушка и кнопка 🧩,
# публикация закрыта, пока блок не заполнен. Сейчас выключен; включить — раскомментировать строку.

release:
  title: Релиз с разбором
  hashtag: "#EML_release"
  kind: post
  source: feed
  # author_block: Моё мнение
  min_len: 1200
  max_len: 2500

tool:
  title: Инструмент недели
  hashtag: "#EML_tool"
  kind: post
  source: feed
  # author_block: Мой опыт
  min_len: 1500
  max_len: 2500

# --- Ещё рубрики по бэклогу --------------------------------------------------------

interview:
  title: Вопрос с ML-собеса
  hashtag: "#EML_interview"
  kind: post
  min_len: 1000
  max_len: 2000

cheatsheet:           # kind: sheet — картинка-шпаргалка с короткой подписью
  title: Шпаргалка
  hashtag: "#EML_cheatsheet"
  kind: sheet
  min_len: 200
  max_len: 700

fact:                 # grounded: у каждой темы в бэклоге должны быть проверенные факты и ссылка на источник
  title: А знали ли вы?
  hashtag: "#EML_didyouknow"
  kind: post
  grounded: true
  min_len: 400
  max_len: 800

# --- Рубрики по заметкам автора (source: notes) -----------------------------------
# Сырьё присылает автор: /note experiment или /note practice, затем текст, файл или голосовое.
# Голосовое без команды бот считает историей с работы.

experiment:
  title: Эксперимент
  hashtag: "#EML_experiment"
  kind: post
  source: notes
  min_len: 1500
  max_len: 3500

practice:
  title: История с работы
  hashtag: "#EML_practice"
  kind: post
  source: notes
  min_len: 1200
  max_len: 2500

# --- Курс (series: true) -----------------------------------------------------------------
# Уроки идут по порядку из data/course.yaml, а не из бэклога. Бот ставит в пост ссылку на предыдущий урок
# и ведёт в канале закреплённое оглавление. Отклонённый черновик урок не пропускает: урок пишется заново.

course:
  title: ML с нуля
  hashtag: "#EML_course"
  kind: rich        # развёрнутый пост: заголовки разделов, таблицы, списки, вопросы с ответом под спойлером
  series: true
  min_len: 3000
  max_len: 7000

# Квиз к уроку курса: бот готовит его сам, как только урок одобрен, по тексту и тезисам этого урока.
# Выходит вечером в день урока и только после самого урока. Отклонил квиз — у этого урока его не будет.
course_quiz:
  title: Проверь себя
  hashtag: "#EML_course"
  kind: quiz
  source: lesson
  follows: course
