# Рубрики канала. Этап 1 — три вечнозелёные; остальные добавляются на этапах 2–3.
# hashtag и title можно менять свободно, key — нет (на него ссылаются расписание, бэклог и промпты).
# У хештегов общий префикс EML_ (Easy_ML): по нему рубрики канала не смешиваются с чужими постами в поиске.
# min_len / max_len — рекомендованная длина видимого текста поста в символах.

concept:
  title: Понятие недели
  hashtag: "#EML_concept"
  kind: post
  min_len: 1200
  max_len: 2000

history:
  title: История ML
  hashtag: "#EML_history"
  kind: post
  min_len: 1000
  max_len: 1800

quiz:
  title: Квиз
  hashtag: "#EML_quiz"
  kind: quiz

# --- Рубрики по источникам (source: feed) -------------------------------------
# Темы для них не берутся из бэклога: бот собирает материалы (data/sources.yaml),
# присылает дайджест кандидатов, а черновик пишется по тексту выбранного источника.

paper:
  title: Разбор статьи
  hashtag: "#EML_paper"
  kind: post
  source: feed
  min_len: 1500
  max_len: 3000

release:
  title: Релиз с разбором
  hashtag: "#EML_release"
  kind: post
  source: feed
  min_len: 1200
  max_len: 2500

tool:
  title: Инструмент недели
  hashtag: "#EML_tool"
  kind: post
  source: feed
  min_len: 1500
  max_len: 2500

# --- Ещё рубрики по бэклогу --------------------------------------------------------

interview:
  title: Вопрос с ML-собеса
  hashtag: "#EML_interview"
  kind: post
  min_len: 1000
  max_len: 2000

cheatsheet:           # kind: sheet — картинка-шпаргалка с короткой подписью
  title: Шпаргалка
  hashtag: "#EML_cheatsheet"
  kind: sheet
  min_len: 200
  max_len: 700

fact:                 # grounded: у каждой темы в бэклоге должны быть проверенные факты и ссылка на источник
  title: А знали ли вы?
  hashtag: "#EML_didyouknow"
  kind: post
  grounded: true
  min_len: 400
  max_len: 800

# --- Рубрики по заметкам автора (source: notes) -----------------------------------
# Сырьё присылает автор: /note experiment или /note practice, затем текст, файл или голосовое.
# Голосовое без команды бот считает историей с работы.

experiment:
  title: Эксперимент
  hashtag: "#EML_experiment"
  kind: post
  source: notes
  min_len: 1500
  max_len: 3500

practice:
  title: История с работы
  hashtag: "#EML_practice"
  kind: post
  source: notes
  min_len: 1200
  max_len: 2500
