# «А знали ли вы?»: у каждой темы — проверенные факты (facts) и ссылка (source). Пост пишется только по ним,
# поэтому в facts должно быть всё, что нужно для истории: кто, когда, что произошло, чем закончилось.
# Факты ниже сверены с текстом статей английской Википедии 20.11.2026. Без facts и source тема не попадёт в базу.
# Из бота: /add fact заголовок | факты своими словами. https://ссылка
fact:
  - title: Бот обыграл профессионала в Dota 2 прямо на сцене главного турнира
    facts: >
      Август 2017 года, турнир The International 2017 — главный ежегодный чемпионат по игре Dota 2. Бот компании
      OpenAI в живом матче один на один обыграл профессионального игрока из Украины по прозвищу Dendi. Это было
      первое публичное выступление проекта. Позже бот превратился в команду из пяти — OpenAI Five. На The
      International 2018 она сыграла две игры против профессиональных команд: бразильской paiN Gaming и сборной
      бывших китайских игроков. В апреле 2019 года на живом мероприятии в Сан-Франциско OpenAI Five выиграла
      серию до двух побед у команды OG — чемпионов The International 2018. Это было последнее публичное
      выступление ботов.
    source: https://en.wikipedia.org/wiki/OpenAI_Five
  - title: Нейросеть, с которой начался нынешний бум ИИ, обучили в спальне на двух игровых видеокартах
    facts: >
      Нейросеть AlexNet разработал в 2012 году Алекс Крижевский вместе с Ильёй Суцкевером. Её обучали на двух
      игровых видеокартах Nvidia GTX 580 с 3 ГБ памяти каждая, в спальне Крижевского в доме его родителей.
      Сеть не помещалась в память одной видеокарты, поэтому её разделили на две части, по одной на карту.
      Обучение заняло пять-шесть дней. Команда под названием SuperVision подала AlexNet на конкурс
      по распознаванию изображений ImageNet 30 сентября 2012 года.
    source: https://en.wikipedia.org/wiki/AlexNet
  - title: Вводя буквы с картинки на сайтах, люди годами оцифровывали книги
    facts: >
      Первая версия сервиса reCAPTCHA (проверка «докажи, что ты не робот», где нужно ввести слова с картинки)
      была ещё и массовым совместным проектом по оцифровке книг: людям показывали страницы, которые компьютерам
      было слишком трудно прочитать. Система помогла оцифровать архив газеты The New York Times, а потом так же
      использовалась в Google Books.
    source: https://en.wikipedia.org/wiki/ReCAPTCHA
  - title: Слово «робот» придумал не инженер, а брат писателя
    facts: >
      Слово «робот» появилось в научно-фантастической пьесе чешского писателя Карела Чапека R.U.R. 1920 года.
      Сам Карел Чапек в статье в газете Lidové noviny назвал настоящим изобретателем слова своего брата Йозефа.
      По-чешски robota — подневольный труд, который крепостные отбывали на землях хозяев. Премьера пьесы
      прошла в Национальном театре 25 января 1921 года.
    source: https://en.wikipedia.org/wiki/R.U.R.
  - title: Секретарша создателя первого чат-бота попросила его выйти из комнаты, чтобы поговорить с программой
    facts: >
      ELIZA — одна из первых программ, способных вести разговор на обычном языке. Её разработал Джозеф Вейценбаум
      в Массачусетском технологическом институте в 1964–1967 годах. Самый известный её сценарий, DOCTOR,
      изображал психотерапевта: программа возвращала человеку его же слова в виде вопросов. Вейценбаум хотел
      исследовать общение человека с машиной и удивился, что некоторые люди, включая его секретаршу,
      приписывали программе человеческие чувства. По рассказам, секретарша попросила его выйти из комнаты,
      чтобы поговорить с ELIZA наедине. Это явление назвали эффектом Элизы.
    source: https://en.wikipedia.org/wiki/ELIZA
  - title: Искусственный интеллект как наука начался с летнего семинара на десять человек
    facts: >
      Дартмутский семинар — летний семинар 1956 года в Дартмутском колледже (США), который принято считать
      событием, основавшим искусственный интеллект как область науки. Организаторов было четверо: Клод Шеннон,
      Джон Маккарти, Натаниэль Рочестер и Марвин Минский. В заявке они предлагали «двухмесячное исследование
      искусственного интеллекта силами десяти человек». Маккарти, тогда молодой преподаватель математики,
      в начале 1955 года обратился за деньгами на семинар в фонд Рокфеллера.
    source: https://en.wikipedia.org/wiki/Dartmouth_workshop
  - title: Компьютер, обыгравший Каспарова, годом раньше ему проиграл
    facts: >
      Шахматный компьютер Deep Blue компании IBM в 1996 году сыграл матч из шести партий с чемпионом мира Гарри
      Каспаровым: выиграл одну партию, две свёл вничью и три проиграл. После этого его железо обновили, удвоив
      скорость. В мае 1997 года в матче-реванше из шести партий Deep Blue победил со счётом 3½–2½: две победы
      и три ничьи. Машина оценивала 200 миллионов позиций в секунду. Это была не обучающаяся система, а набор
      правил и параметров, которые задали и настроили шахматные мастера и программисты. Сегодня одна из двух
      стоек Deep Blue хранится в Национальном музее американской истории, другая — в Музее компьютерной истории.
    source: https://en.wikipedia.org/wiki/Deep_Blue_(chess_computer)
  - title: Чат-бот Microsoft проработал в Twitter всего 16 часов
    facts: >
      Tay — чат-бот компании Microsoft, запущенный в Twitter 23 марта 2016 года под именем TayTweets. Бот начал
      публиковать провокационные и оскорбительные твиты, и Microsoft отключила его через 16 часов после запуска.
      За это время Tay написал больше 96 000 твитов. В Microsoft объяснили случившееся «скоординированной атакой
      группы людей», которые «использовали уязвимость» бота.
    source: https://en.wikipedia.org/wiki/Tay_(chatbot)
  - title: Статья, на которой держатся нынешние чат-боты, названа в честь песни The Beatles
    facts: >
      «Attention Is All You Need» — научная статья 2017 года, которую написали восемь учёных и инженеров
      из Google. В ней описан трансформер — устройство нейросети, на котором построены современные языковые
      модели. Название статьи — отсылка к песне The Beatles «All You Need Is Love». После публикации все
      восемь авторов ушли из Google: кто-то в другие компании, кто-то основал собственные стартапы.
    source: https://en.wikipedia.org/wiki/Attention_Is_All_You_Need
  - title: Главную коллекцию картинок для обучения ИИ размечали вручную — 14 миллионов штук
    facts: >
      ImageNet — огромная коллекция изображений с подписями, на которой учили и сравнивали программы
      распознавания картинок. Исследовательница Фэй-Фэй Ли начала работать над идеей в 2006 году. В проекте
      вручную размечено больше 14 миллионов изображений: люди указывали, что на них изображено. Для разметки
      использовали Amazon Mechanical Turk — сервис, где множество людей за небольшую плату выполняют простые
      задания. Бюджета хватило, чтобы каждую картинку разметили трижды. В 2012 году ImageNet был крупнейшим
      в мире академическим пользователем этого сервиса.
    source: https://en.wikipedia.org/wiki/ImageNet
  - title: Программа научилась играть в нарды почти на уровне чемпионов, сыграв полтора миллиона партий сама с собой
    facts: >
      TD-Gammon — программа для игры в нарды, которую в 1990-х годах разработал Джеральд Тезауро в IBM.
      В 1993 году её версия 2.1 обучилась на 1,5 миллиона партий, сыгранных против самой себя, и вышла на
      уровень лишь немного ниже лучших игроков-людей того времени. Программа пробовала стратегии, которыми люди
      не пользовались, и её игра привела к новым открытиям в теории нард.
    source: https://en.wikipedia.org/wiki/TD-Gammon
  - title: Термин «машинное обучение» придумал человек, который учил компьютер играть в шашки
    facts: >
      Артур Сэмюэл ввёл термин «машинное обучение» в 1959 году. Он работал в IBM и написал первую программу для
      игры в шашки на IBM 701 — первом коммерческом компьютере компании. В сообществе ИИ он известен прежде
      всего работой над компьютерными шашками 1959 года и исследованиями машинного обучения, которые начал
      в 1949 году.
    source: https://en.wikipedia.org/wiki/Arthur_Samuel_(computer_scientist)
  - title: Программа за четыре часа научилась играть в шахматы сильнее лучшего шахматного движка
    facts: >
      AlphaZero — программа компании DeepMind, описанная в научной работе 5 декабря 2017 года. Она училась
      играть сама. По оценке DeepMind, после четырёх часов обучения AlphaZero играла в шахматы сильнее, чем
      Stockfish 8 — одна из сильнейших шахматных программ того времени. После девяти часов обучения она
      выиграла у Stockfish 8 матч из 100 партий: 28 побед, 72 ничьи и ни одного поражения.
    source: https://en.wikipedia.org/wiki/AlphaZero
  - title: Компьютер IBM выиграл миллион долларов в телевикторине, не подключаясь к интернету
    facts: >
      Watson — компьютерная система IBM, созданная, чтобы отвечать на вопросы американской телевикторины
      Jeopardy!. В 2011 году Watson сыграл против чемпионов викторины Брэда Раттера и Кена Дженнингса и выиграл
      первый приз — 1 миллион долларов. Во время игры у системы был доступ к 200 миллионам страниц текста,
      которые занимали четыре терабайта на дисках, включая полный текст Википедии, но к интернету Watson
      подключён не был.
    source: https://en.wikipedia.org/wiki/IBM_Watson
  - title: Тест Тьюринга начинался как салонная игра «угадай, кто мужчина, а кто женщина»
    facts: >
      Алан Тьюринг описал свой тест в статье 1950 года «Вычислительные машины и разум» (Computing Machinery and
      Intelligence), когда работал в Манчестерском университете. Он назвал его «игрой в имитацию». За основу
      взята игра для компании из трёх человек: ведущий задаёт вопросы мужчине и женщине, которые находятся
      в другой комнате, и пытается определить, кто из них кто.
    source: https://en.wikipedia.org/wiki/Turing_test
