# «А знали ли вы?»: у каждой темы — проверенные факты (facts), ссылка (source) и название источника (source_name).
# Пост пишется только по фактам, поэтому в facts должно быть всё, что нужно для истории: кто, когда, что произошло.
#
# Источник — первоисточник или издание с редакцией: статья самих авторов, блог компании или лаборатории, музей,
# научный журнал, профильное издание. Википедия и её копии не принимаются: бот такую тему пропустит.
# В facts попадает только то, что есть на странице по ссылке. Чего там нет, того нет и в посте, даже если это правда.
# Факты ниже сверены с текстом источников 21.11.2026.
# Из бота: /add fact заголовок | факты своими словами. https://ссылка
#
# Отложено до проверки: «Статья, на которой держатся нынешние чат-боты, названа в честь песни The Beatles».
# Источник — материал Wired (Стивен Леви, 2024) о восьми авторах «Attention Is All You Need»; страницу открыть
# не удалось, поэтому факты по ней не сверены и тема в бэклог не включена.
fact:
  - title: "ИИ обыграл чемпионов мира по Dota 2 и сразу ушёл из спорта"
    facts: >-
      В субботу 13 апреля 2019 года система OpenAI Five — пять ботов компании OpenAI для командной игры Dota 2
      — дважды подряд обыграла команду OG, действующих чемпионов мира. По словам OpenAI, это первый случай,
      когда ИИ победил чемпионов мира в киберспортивной игре. Годом раньше, на турнире The International 2018,
      OpenAI Five проиграла. К финалу система тренировалась, играя сама с собой: за 10 месяцев она набрала
      около 45 000 лет игрового опыта, в среднем по 250 лет за сутки. 15 апреля, подводя итоги, OpenAI
      объявила, что OpenAI Five больше не будет выступать на соревнованиях. Напоследок, с 18 по 21 апреля, с
      ботами мог сыграть любой желающий: против них или в одной команде.
    source: https://openai.com/index/openai-five-defeats-dota-2-world-champions
    source_name: "блог OpenAI"
  - title: "Нейросеть, изменившую весь ИИ, обучили в спальне на двух видеокартах"
    facts: >-
      Нейросеть AlexNet создали в 2012 году аспиранты Университета Торонто Алекс Крижевский и Илья Суцкевер,
      их научным руководителем был Джеффри Хинтон. Суцкевер убедил Крижевского обучить свёрточную нейросеть на
      наборе картинок ImageNet. Обучение шло на компьютере с двумя видеокартами Nvidia, который стоял в
      спальне Крижевского в доме его родителей. Около года Крижевский подкручивал настройки сети и обучал её
      заново, пока она не обошла конкурентов. Сеть назвали AlexNet в его честь. Осенью 2012 года Крижевский
      представил работу на конференции по компьютерному зрению во Флоренции. Опытные исследователи отнеслись к
      ней с недоверием, но Ян Лекун, который был в зале, назвал её поворотным моментом для ИИ. Хинтон описывал
      роли так: «Илья считал, что это надо сделать, Алекс заставил это работать». По словам Музея компьютерной
      истории, AlexNet преобразила всю область искусственного интеллекта: до неё почти ни одна из ведущих
      работ по компьютерному зрению не использовала нейросети.
    source: https://computerhistory.org/blog/chm-releases-alexnet-source-code/
    source_name: "Музей компьютерной истории"
  - title: "Вводя буквы с картинки на сайтах, люди годами оцифровывали книги"
    facts: >-
      16 сентября 2009 года Google объявила о покупке сервиса reCAPTCHA. Об этом в официальном блоге компании
      написали сооснователь reCAPTCHA Луис фон Ан и менеджер Google Уилл Кэткарт. reCAPTCHA — проверка
      «докажи, что ты не робот», где нужно ввести слова с картинки. Многие слова для неё брали из
      отсканированных старых газет и книг. Чернила и бумага со временем испортились, поэтому программы
      распознавания текста на таких словах ошибаются. Вводя их, люди учили компьютеры читать отсканированный
      текст. Та же технология распознавания нужна большим проектам оцифровки вроде Google Books и Google News
      Archive Search.
    source: https://googleblog.blogspot.com/2009/09/teaching-computers-to-read-google.html
    source_name: "официальный блог Google"
  - title: "Слово «робот» придумал не автор пьесы о роботах, а его брат-художник"
    facts: >-
      Слово «робот» пришло из пьесы R.U.R. («Россумские универсальные роботы») чешского писателя Карела
      Чапека. Как оно появилось, Чапек рассказал в заметке «О слове робот» в газете Lidové noviny 24 декабря
      1933 года. Замысел пьесы пришёл к нему внезапно, и он пошёл к брату Йозефу, художнику, который стоял за
      мольбертом. Автор сказал, что придумал пьесу, но не знает, как назвать искусственных рабочих: слово
      «лаборжи» ему не нравилось. Йозеф, не вынимая кисти изо рта, ответил: «Так назови их
      роботами». По словам заметки, автор пьесы это слово не изобрёл, а только ввёл в обиход. Роботы у Чапека
      были не механизмами, а искусственно созданными живыми рабочими. Йозеф Чапек оформил и обложку издания
      пьесы 1920 года.
    source: https://blackbird-archive.vcu.edu/v21n2/gallery/capek-brothers/roboti-page.shtml
    source_name: "журнал Blackbird, Университет Содружества Виргинии"
  - title: "Секретарша создателя первого чат-бота попросила его выйти из комнаты, чтобы поговорить с программой"
    facts: >-
      Программу Eliza создал Джозеф Вейценбаум, учёный из лаборатории искусственного интеллекта
      Массачусетского технологического института, в 1964–1966 годах. Она работала на большой ЭВМ IBM 7094 и
      была написана на языке MAD-SLIP, который Вейценбаум разработал сам. Eliza подражала манере
      психотерапевта: возвращала человеку его же слова в виде вопросов и цеплялась за ключевые слова вроде
      «парень» или «подавлена». Вейценбаум звал в кабинет студентов и коллег и смотрел, как они общаются с
      машиной. Больше всего его встревожил случай с секретаршей: она много месяцев видела, как он пишет
      программу с нуля, и всё равно настояла, чтобы он вышел из комнаты и дал ей поговорить с Eliza наедине.
      Вейценбаум назвал это эффектом Элизы и считал его разновидностью самообмана, которым люди будут страдать
      в цифровую эпоху.
    source: https://spectrum.ieee.org/why-people-demanded-privacy-to-confide-in-the-worlds-first-chatbot
    source_name: "IEEE Spectrum"
  - title: "Четверо учёных в 1955 году собирались разобраться с ИИ за одно лето вдесятером"
    facts: >-
      31 августа 1955 года четверо учёных подписали заявку под названием «Предложение о Дартмутском летнем
      исследовательском проекте по искусственному интеллекту». Авторы: Джон Маккарти из Дартмутского колледжа,
      Марвин Минский из Гарварда, Натаниэль Рочестер из IBM и Клод Шеннон из Bell Telephone Laboratories. Они
      предлагали летом 1956 года в Дартмутском колледже провести «двухмесячное исследование искусственного
      интеллекта силами десяти человек». В основе лежала гипотеза: любую сторону обучения и любое другое
      свойство интеллекта в принципе можно описать настолько точно, что машина сможет его имитировать. Авторы
      собирались выяснить, как научить машины пользоваться языком, формировать абстракции и понятия, решать
      задачи, которые пока под силу только людям, и улучшать самих себя. Они считали, что заметно продвинуться
      можно, если тщательно подобранная группа учёных поработает над этим вместе одно лето. Оригинал заявки —
      17 машинописных страниц; копии хранятся в архивах Дартмутского колледжа и Стэнфордского университета. В
      2006 году текст перепечатал журнал AI Magazine.
    source: https://ojs.aaai.org/index.php/aimagazine/article/view/1904
    source_name: "журнал AI Magazine"
  - title: "Компьютер, обыгравший Каспарова, годом раньше ему проиграл"
    facts: >-
      Шахматный компьютер Deep Blue создала компания IBM. В 1996 году он сыграл матч из шести партий с
      чемпионом мира Гарри Каспаровым. Deep Blue выиграл первую партию, но матч со счётом 4:2 остался за
      Каспаровым. После этого команда доработала машину: улучшила базы эндшпилей, усилила оценку позиции и
      привлекла больше гроссмейстеров. В мае 1997 года в Нью-Йорке прошёл матч-реванш. Каспаров выиграл первую
      партию, Deep Blue — вторую, три следующие закончились вничью, а шестую снова выиграл компьютер: итог
      3,5:2,5 в пользу Deep Blue. Машина оценивала 200 миллионов позиций в секунду и, по словам IBM, брала
      грубой вычислительной силой. После матча её передали в музей — Смитсоновский институт в Вашингтоне.
    source: https://www.ibm.com/history/deep-blue
    source_name: "IBM"
  - title: "Чат-бот Microsoft проработал в Twitter всего 16 часов"
    facts: >-
      23 марта 2016 года Microsoft запустила в Twitter чат-бота Tay. В отличие от старых чат-ботов вроде
      Eliza, которые следовали заранее написанным сценариям, Tay должна была учиться языку у собеседников и
      поддерживать разговор на любую тему. Сначала она безобидно шутила с подписчиками, но уже через несколько
      часов начала публиковать оскорбительные сообщения. На форуме 4chan появилась ссылка на её аккаунт с
      призывом завалить бота расистскими и женоненавистническими репликами. Тролли пользовались функцией
      «повторяй за мной», а из-за способности учиться Tay стала повторять такие выражения и сама. За 16 часов
      после запуска она написала больше 95 000 твитов, и Microsoft заблокировала аккаунт. Через несколько
      месяцев компания выпустила Zo — «политкорректную» версию, которая избегала спорных тем вроде политики и
      религии.
    source: https://spectrum.ieee.org/in-2016-microsofts-racist-chatbot-revealed-the-dangers-of-online-conversation
    source_name: "IEEE Spectrum"
  - title: "Главную коллекцию картинок для обучения ИИ два с половиной года размечали вручную"
    facts: >-
      В 2006 году Фэй-Фэй Ли, тогда начинающий профессор информатики в Иллинойсском университете, задумалась:
      её коллеги улучшали алгоритмы, но лучший алгоритм не сработает, если данные, на которых он учится, не
      отражают реальный мир. В начале 2007 года, перейдя в Принстон, она начала проект ImageNet — огромный
      набор картинок с подписями о том, что на них изображено. Размечать картинки пробовали силами студентов,
      потом алгоритмами: выходило слишком медленно или неточно, а денег не было — проект не получил ни одного
      федерального гранта, на которые Ли подавала заявки. Выручил сервис Amazon Mechanical Turk, через который
      простые задания выполняют люди за компьютерами по всему миру. Даже с ним работа заняла два с половиной
      года. В первой версии было 3,2 миллиона размеченных изображений в 5247 категориях, позже их стало больше
      13 миллионов. Статью 2009 года встретили прохладно: на конференции CVPR ей дали только стендовый доклад,
      и команда раздавала ручки с логотипом ImageNet. В 2012 году на конкурсе ImageNet нейросеть AlexNet
      команды из Торонто обошла соперников с отрывом в 10,8%.
    source: https://qz.com/1034972/the-data-that-changed-the-direction-of-ai-research-and-possibly-the-world
    source_name: "Quartz"
  - title: "Программа научилась играть в нарды почти на уровне чемпионов, играя сама с собой"
    facts: >-
      TD-Gammon — программа для игры в нарды, которую создал Джеральд Тезауро из исследовательского центра IBM
      имени Томаса Уотсона. Он рассказал о ней в журнале Communications of the ACM в марте 1995 года.
      Программа — нейросеть, которая училась, играя сама с собой: делала ходы за обе стороны и училась на
      исходах партий, причём начинала со случайных настроек. По оценке игрока Билла Роберти, версия 2.1 играла
      почти наравне с лучшими людьми мира: разница составляла несколько сотых очка. В серии из 40 партий
      против самого Роберти программа вела почти всё время, и только в последней партии он вышел вперёд с
      перевесом в одно очко. TD-Gammon повлияла и на людей: для некоторых первых ходов эксперты долго
      предпочитали один вариант, а разбор программы показал, что другой сильнее. Ведущие игроки попробовали
      его на турнирах, и со временем он стал почти общепринятым.
    source: https://bkgm.com/articles/tesauro/tdl.html
    source_name: "статья Джеральда Тезауро в Communications of the ACM"
  - title: "Термин «машинное обучение» придумал человек, который учил компьютер играть в шашки"
    facts: >-
      Артур Сэмюэл пришёл в IBM в 1949 году. До этого он был профессором и инженером-электриком, известным
      работами по электронным лампам. В IBM он занялся необычным делом: стал учить компьютер играть в шашки.
      Программу он разрабатывал на IBM 701. Она запоминала позиции, которые ей встречались, и то, привели ли
      они в итоге к победе или к поражению, а потом пользовалась этим при выборе хода — и играла тем лучше,
      чем больше играла. Перед матчем 1962 года программа сыграла тысячи партий сама с собой и победила
      Роберта Нили, который называл себя мастером шашек. Позже её результаты против людей были неровными. IBM
      называет Сэмюэла автором термина «машинное обучение».
    source: https://www.ibm.com/history/early-games
    source_name: "IBM"
  - title: "Программа за четыре часа научилась играть в шахматы сильнее лучшего шахматного движка"
    facts: >-
      AlphaZero — программа компании DeepMind, которая сама научилась играть в шахматы, сёги (японские
      шахматы) и го. Она начинала со случайных ходов, не знала ничего, кроме правил, и училась, играя сама с
      собой. По данным DeepMind, в шахматах AlphaZero впервые превзошла программу Stockfish уже через 4 часа
      обучения; всё обучение шахматам заняло около 9 часов. Stockfish был чемпионом мира среди шахматных
      программ 2016 года по версии турнира TCEC. В матче из 1000 партий AlphaZero выиграла 155 и проиграла 6.
      При этом она просматривала около 60 тысяч позиций в секунду, а Stockfish — примерно 60 миллионов. Полные
      результаты DeepMind опубликовала в журнале Science в декабре 2018 года.
    source: https://deepmind.google/blog/alphazero-shedding-new-light-on-chess-shogi-and-go/
    source_name: "блог Google DeepMind"
  - title: "Компьютер IBM обыграл двух чемпионов телевикторины, не подключаясь к интернету"
    facts: >-
      В феврале 2011 года в эфире американской телевикторины Jeopardy! компьютер IBM Watson обыграл двух самых
      успешных чемпионов за всю её историю — Брэда Раттера и Кена Дженнингса. Watson набрал 77 147 долларов,
      Дженнингс — 24 000, Раттер — 21 600. Выигрыш Watson IBM передала на благотворительность. Компьютер
      понимал вопросы, заданные обычным языком, и отвечал, не подключаясь к интернету: заранее в него
      загрузили горы текстов — Википедию, энциклопедии, словари, религиозные тексты, романы, пьесы и книги
      проекта «Гутенберг». Сам Watson занимал целую комнату: 10 стоек, 90 серверов и 2880 процессорных ядер.
      Назвали его в честь первого главы IBM Томаса Уотсона.
    source: https://www.ibm.com/history/watson-jeopardy
    source_name: "IBM"
  - title: "Тест Тьюринга начинался как игра «угадай, кто мужчина, а кто женщина»"
    facts: >-
      В 1950 году Алан Тьюринг опубликовал в журнале Mind статью «Вычислительные машины и разум». Она
      начинается с вопроса «Могут ли машины мыслить?», но Тьюринг тут же заменяет его другим и описывает «игру
      в имитацию». В ней участвуют трое: мужчина (A), женщина (B) и ведущий (C), который может быть любого
      пола. Ведущий сидит в отдельной комнате и знает двух других только под метками X и Y. Задавая вопросы,
      он должен определить, кто из них мужчина, а кто женщина. Ответы пишут или печатают, чтобы голос ничего
      не выдал; в идеале комнаты соединяет телетайп. Затем Тьюринг спрашивает: что будет, если роль A в этой
      игре возьмёт на себя машина? Будет ли ведущий ошибаться так же часто, как в игре с мужчиной и женщиной?
      Этот вопрос, по словам Тьюринга, и заменяет исходный.
    source: https://courses.cs.umbc.edu/471/papers/turing.shtml
    source_name: "статья Алана Тьюринга в журнале Mind"
